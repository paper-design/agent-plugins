name: Build

on:
  push:
    branches: [main]

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - run: bun ./scripts/validate-mcpb-artifact.mjs

      # The ZIP uploaded to the OpenAI plugin submission portal
      - uses: actions/upload-artifact@v4
        with:
          name: paper-chatgpt-plugin
          path: dist/paper-chatgpt-plugin.zip
